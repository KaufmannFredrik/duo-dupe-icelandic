<!doctype html>
<html lang="en" data-scan-page="low" data-scan="low">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1A1A2E">
  <title>TÖLVA</title>
  <link rel="icon" href="assets/tala/tala-happy-head.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <script type="module" src="js/pages/stories.js"></script>
</head>
<body data-shell data-page="stories" data-title-key="title.stories">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
  <div class="shell">
    <nav class="app-nav" aria-label="Main" data-i18n-aria-label="nav.main" data-shell="nav"></nav>
    <div class="shell__col">
      <header class="hud" data-shell="hud"></header>
      <main id="main" class="app-main" tabindex="-1">
        <div class="page-head">
          <h1 data-i18n="title.stories">Stories</h1>
          <p data-i18n="stories.intro">Short readings where every word is explained. Tap a word to see what it is doing in the sentence.</p>
        </div>
        <div class="grid-cards story-list" data-story-list></div>
        <section class="card card--quiet stack story" aria-labelledby="story-title" data-reader>
          <p><a class="back-link" href="stories.html"><svg class="icon icon--sm" aria-hidden="true"><use href="assets/icons.svg#i-arrow-left"></use></svg><span data-i18n="stories.all">All stories</span></a></p>
          <h2 id="story-title" data-story-title></h2>
          <ul class="story__cast" role="list" aria-label="In this story" data-i18n-aria-label="stories.cast" data-story-cast hidden></ul>
          <div class="cluster story__controls">
            <button type="button" class="button button-primary" data-play-all aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-play"></use></svg><span data-i18n="stories.playAll">Play all</span></button>
            <label class="switch reader__switch"><span data-i18n="stories.translations">Show translations</span><input type="checkbox" data-show-translations><span class="switch__track" aria-hidden="true"></span></label>
          </div>
          <div class="reader">
            <div class="reader__text" data-reader-text></div>
            <div class="sheet word-panel" id="word-panel" role="region" aria-label="Word details" data-i18n-aria-label="stories.panel" aria-live="polite" data-word-panel></div>
          </div>
          <p class="credit" data-reader-credits></p>
          <p class="credit" data-voice-credit></p>
        </section>
      </main>
      <footer class="app-footer" data-shell="footer"></footer>
    </div>
    <aside class="app-side" aria-label="Your progress" data-i18n-aria-label="side.label" data-shell="side"></aside>
  </div>
</body>
</html>
