<!doctype html>
<html lang="en" data-scan-page="default" data-scan="default">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#1A1A2E">
  <title>TÖLVA</title>
  <link rel="icon" href="assets/tala/tala-happy-head.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <script type="module" src="js/pages/profile.js"></script>
</head>
<body data-shell data-page="profile" data-title-key="title.profile">
  <a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
  <div class="shell">
    <nav class="app-nav" aria-label="Main" data-i18n-aria-label="nav.main" data-shell="nav"></nav>
    <div class="shell__col">
      <header class="hud" data-shell="hud"></header>
      <main id="main" class="app-main" tabindex="-1">
        <div class="page-head">
          <h1 data-i18n="title.profile">Profile</h1>
          <p data-i18n="profile.intro">Your progress is stored on this device only. There are no accounts.</p>
          <p><span class="tag tag--demo" data-i18n="demo.tag">Demo data</span></p>
        </div>
        <div class="stats-grid" data-stats></div>
        <section class="card card--quiet stack" aria-labelledby="goal-title">
          <h2 id="goal-title" data-i18n="side.goal">Daily goal</h2>
          <div class="goal-row" data-goal></div>
        </section>
        <section class="stack" aria-labelledby="badges-title">
          <h2 id="badges-title" data-i18n="profile.badges">Badges</h2>
          <ul class="badges" role="list" data-badges></ul>
        </section>
        <section class="card card--quiet stack" aria-labelledby="data-title">
          <h2 id="data-title" data-i18n="profile.data">Your data</h2>
          <p data-i18n="profile.dataText">Export all progress as a file, or import it on another device. This arrives in Phase 5.</p>
          <div class="cluster">
            <button class="button" type="button" disabled><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-download"></use></svg><span data-i18n="profile.export">Export progress</span></button>
            <button class="button" type="button" disabled><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-upload"></use></svg><span data-i18n="profile.import">Import progress</span></button>
            <a class="button button-primary" href="settings.html"><svg class="icon" aria-hidden="true"><use href="assets/icons.svg#i-settings"></use></svg><span data-i18n="nav.settings">Settings</span></a>
          </div>
        </section>
      </main>
      <footer class="app-footer" data-shell="footer"></footer>
    </div>
    <aside class="app-side" aria-label="Your progress" data-i18n-aria-label="side.label" data-shell="side"></aside>
  </div>
</body>
</html>
