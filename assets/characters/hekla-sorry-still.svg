<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hekla">

<defs>
  <linearGradient id="he-rock" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#3B2C6E"/><stop offset="0.55" stop-color="#2A2156"/><stop offset="1" stop-color="#17133A"/></linearGradient>
  <linearGradient id="he-snow" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F2F4FF"/><stop offset="1" stop-color="#B8BEE6"/></linearGradient>
  <radialGradient id="he-crater" cx="0.5" cy="0.6" r="0.6"><stop offset="0" stop-color="#FFE066"/><stop offset="0.5" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FF006E"/></radialGradient>
  <linearGradient id="he-lava" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FFE066"/><stop offset="0.5" stop-color="#FF7A1A"/><stop offset="1" stop-color="#FF006E" stop-opacity="0.2"/></linearGradient>
  <linearGradient id="he-rimL" x1="0" x2="1"><stop offset="0" stop-color="#00FFFF" stop-opacity="0.9"/><stop offset="0.3" stop-color="#00FFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="he-rimR" x1="1" x2="0"><stop offset="0" stop-color="#FF10F0" stop-opacity="0.9"/><stop offset="0.3" stop-color="#FF10F0" stop-opacity="0"/></linearGradient>
  <radialGradient id="he-steam" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#D9D6F0" stop-opacity="0.95"/><stop offset="1" stop-color="#9A96C8" stop-opacity="0.85"/></radialGradient>
  <radialGradient id="he-cheek" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FF7A1A" stop-opacity="0.55"/><stop offset="1" stop-color="#FF006E" stop-opacity="0"/></radialGradient>
  <radialGradient id="he-glow" cx="0.5" cy="0.4" r="0.5"><stop offset="0" stop-color="#FF7A1A" stop-opacity="0.35"/><stop offset="0.5" stop-color="#FF10F0" stop-opacity="0.12"/><stop offset="1" stop-color="#0080FF" stop-opacity="0"/></radialGradient>
  <linearGradient id="he-ground" x1="0" x2="1"><stop offset="0" stop-color="#00FFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FF10F0"/><stop offset="1" stop-color="#00FFFF" stop-opacity="0"/></linearGradient>
  <filter id="he-soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
  <filter id="he-bloom" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
  <clipPath id="he-clip"><path d="M14 214C40 196 58 170 72 146C84 124 92 96 98 74C104 66 112 63 120 64C128 63 137 65 144 72C150 96 158 122 170 144C184 170 202 196 226 214Z"/></clipPath>
</defs>
<circle cx="120" cy="112" r="108" fill="url(#he-glow)"/>
<g class="he-breathe">

<!-- steam plume -->
<g opacity="0.92" transform="translate(120 66) scale(0.55) translate(-120 -66)">
  <g class="he-steam"><circle cx="112" cy="46" r="13" fill="url(#he-steam)"/>
  <circle cx="128" cy="40" r="16" fill="url(#he-steam)"/>
  <circle cx="144" cy="30" r="12" fill="url(#he-steam)"/>
  <circle cx="156" cy="20" r="9" fill="url(#he-steam)"/>
  <circle cx="100" cy="54" r="9" fill="url(#he-steam)"/>
  <path d="M104 42C110 34 120 30 130 30" stroke="#FFFFFF" stroke-width="2" fill="none" opacity="0.7" stroke-linecap="round"/>
  <path d="M146 22C150 18 156 16 160 17" stroke="#FFFFFF" stroke-width="1.6" fill="none" opacity="0.6" stroke-linecap="round"/></g>
</g>
<!-- sparks -->
<g class="he-spark"><circle cx="96" cy="34" r="1.8" fill="#FFD700"/><circle cx="168" cy="38" r="1.5" fill="#FFD700"/></g><g class="he-spark2"><circle cx="84" cy="50" r="1.2" fill="#FFE066"/><circle cx="160" cy="54" r="1.4" fill="#FFE066"/></g>

<!-- mountain -->
<path d="M14 214C40 196 58 170 72 146C84 124 92 96 98 74C104 66 112 63 120 64C128 63 137 65 144 72C150 96 158 122 170 144C184 170 202 196 226 214Z" fill="url(#he-rock)"/>
<g clip-path="url(#he-clip)">
  <path d="M76.9 106C98.4 112 141.6 112 163.1 106" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.2"/><path d="M66.3 122C93.2 128 146.8 128 173.7 122" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.2"/><path d="M55.8 138C87.9 144 152.1 144 184.2 138" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.2"/><path d="M45.2 154C82.6 160 157.4 160 194.8 154" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.2"/><path d="M34.6 170C77.3 176 162.7 176 205.4 170" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.2"/><path d="M24.1 186C72 192 168 192 215.9 186" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.3"/><path d="M13.5 202C66.8 208 173.2 208 226.5 202" stroke="#00FFFF" stroke-width="1" fill="none" opacity="0.3"/>
  <path d="M105.6 76C92.8 130 70.4 176 41.6 214" stroke="#FF10F0" stroke-width="1" fill="none" opacity="0.18"/><path d="M113.7 76C108.1 130 98.3 176 85.7 214" stroke="#FF10F0" stroke-width="1" fill="none" opacity="0.18"/><path d="M126.3 76C131.9 130 141.7 176 154.3 214" stroke="#FF10F0" stroke-width="1" fill="none" opacity="0.18"/><path d="M134.4 76C147.2 130 169.6 176 198.4 214" stroke="#FF10F0" stroke-width="1" fill="none" opacity="0.18"/>
  <path d="M14 214C40 196 58 170 72 146C84 124 92 96 98 74C104 66 112 63 120 64C128 63 137 65 144 72C150 96 158 122 170 144C184 170 202 196 226 214Z" fill="none" stroke="url(#he-rimL)" stroke-width="10" filter="url(#he-soft)"/>
  <path d="M14 214C40 196 58 170 72 146C84 124 92 96 98 74C104 66 112 63 120 64C128 63 137 65 144 72C150 96 158 122 170 144C184 170 202 196 226 214Z" fill="none" stroke="url(#he-rimR)" stroke-width="10" filter="url(#he-soft)"/>
  <!-- snow cap with drips -->
  <path d="M90 70H152L158 98C152 104 148 96 144 102C140 110 134 100 130 106C126 114 120 104 116 108C112 114 106 102 102 106C98 110 94 100 88 104Z" fill="url(#he-snow)"/>
  <path d="M96 76C100 72 106 70 112 70" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M90 78C92 88 92 96 88 104" stroke="#00FFFF" stroke-width="3" fill="none" opacity="0.6" filter="url(#he-soft)"/>
  <!-- lava trickles -->
  <path d="M108 70C106 82 110 92 106 104C104 112 108 118 106 124" stroke="url(#he-lava)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M136 70C138 80 134 88 138 98C140 106 136 112 140 120C142 126 140 132 142 136" stroke="url(#he-lava)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
</g>
<!-- crater -->
<ellipse cx="121" cy="67" rx="25" ry="6" fill="#17133A"/>
<ellipse cx="121" cy="68" rx="20" ry="4.4" fill="url(#he-crater)"/>
<ellipse cx="121" cy="66" rx="24" ry="8" fill="#FF7A1A" filter="url(#he-bloom)" class="he-lava"/>
<path d="M114 66C118 64 124 64 128 66" stroke="#FFFBD0" stroke-width="1.4" fill="none" opacity="0.9" stroke-linecap="round"/>

<!-- face -->
<ellipse cx="96" cy="160" rx="12" ry="7" fill="url(#he-cheek)" opacity="0.4"/><ellipse cx="146" cy="160" rx="12" ry="7" fill="url(#he-cheek)" opacity="0.4"/><path d="M88 131Q98 129 108 124" stroke="#17133A" stroke-width="3.4" fill="none" stroke-linecap="round"/><path d="M134 124Q144 129 154 131" stroke="#17133A" stroke-width="3.4" fill="none" stroke-linecap="round"/><ellipse cx="98" cy="143" rx="7.5" ry="9" fill="#0A0A16"/><ellipse cx="97.4" cy="147.4" rx="4" ry="5" fill="#FFD700" opacity="0.9"/><circle cx="99.9" cy="141.9" r="2.4" fill="#FFFFFF"/><circle cx="94.9" cy="150.4" r="1" fill="#FFFFFF" opacity="0.8"/><ellipse cx="144" cy="143" rx="7.5" ry="9" fill="#0A0A16"/><ellipse cx="143.4" cy="147.4" rx="4" ry="5" fill="#FFD700" opacity="0.9"/><circle cx="145.9" cy="141.9" r="2.4" fill="#FFFFFF"/><circle cx="140.9" cy="150.4" r="1" fill="#FFFFFF" opacity="0.8"/>
<path d="M110 170Q121 163 132 170" stroke="#17133A" stroke-width="2.6" fill="none" stroke-linecap="round"/>


<!-- horizon -->
<path d="M6 214H234" stroke="url(#he-ground)" stroke-width="3"/>
<path d="M6 214H234" stroke="url(#he-ground)" stroke-width="8" opacity="0.4" filter="url(#he-soft)"/>
</g>
</svg>
