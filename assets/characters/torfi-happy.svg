<style>.to-breathe{animation:to-breathe 6.4s ease-in-out infinite}@keyframes to-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.3px)}}.to-glass{animation:to-flicker 3.4s steps(1) infinite}@keyframes to-flicker{0%,100%{opacity:1}22%{opacity:0.86}24%{opacity:1}61%{opacity:0.9}63%{opacity:1}}.to-smoke{animation:to-smoke 6s ease-in-out infinite}@keyframes to-smoke{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:0.7}}.to-door{animation:to-door 3s 0s ease-in-out infinite}@keyframes to-door{0%,100%{opacity:0.3}50%{opacity:0.6}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
