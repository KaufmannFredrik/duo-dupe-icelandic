<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lundi">
<style>.lu-breathe{animation:lu-breathe 3.8s ease-in-out infinite}@keyframes lu-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.3px)}}.lu-lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:lu-blink 4.6s infinite}@keyframes lu-blink{0%,92%,100%{transform:scaleY(0)}94.5%{transform:scaleY(1)}97%{transform:scaleY(0)}}.lu-fish{transform-box:fill-box;transform-origin:50% 0%;animation:lu-fish 2.6s ease-in-out infinite}@keyframes lu-fish{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="lu-plume" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#22244A"/><stop offset="1" stop-color="#14152E"/></linearGradient>
  <radialGradient id="lu-disc" cx="0.55" cy="0.35" r="0.75"><stop offset="0" stop-color="#F1F1F7"/><stop offset="0.7" stop-color="#B9BACB"/><stop offset="1" stop-color="#8D8EA6"/></radialGradient>
  <linearGradient id="lu-belly" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F1F1F7"/><stop offset="1" stop-color="#B9BACB"/></linearGradient>
  <linearGradient id="lu-bill" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#FF5A2A"/><stop offset="1" stop-color="#D7331A"/></linearGradient>
  <linearGradient id="lu-eel" x1="0" x2="1"><stop offset="0" stop-color="#E6F6FF"/><stop offset="0.6" stop-color="#9FC0D8"/><stop offset="1" stop-color="#5E7C9C"/></linearGradient>
  <linearGradient id="lu-rimL" x1="0" x2="1"><stop offset="0" stop-color="#00FFFF" stop-opacity="0.9"/><stop offset="0.35" stop-color="#00FFFF" stop-opacity="0"/></linearGradient>
  <linearGradient id="lu-rimR" x1="1" x2="0"><stop offset="0" stop-color="#FF10F0" stop-opacity="0.85"/><stop offset="0.35" stop-color="#FF10F0" stop-opacity="0"/></linearGradient>
  <radialGradient id="lu-glow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#0080FF" stop-opacity="0.32"/><stop offset="0.6" stop-color="#00FFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#00FFFF" stop-opacity="0"/>
  </radialGradient>
  <filter id="lu-soft" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.8"/></filter>
  <clipPath id="lu-back"><path d="M34 240C30 206 40 172 58 146C66 132 66 112 70 98C76 70 98 50 124 50C142 50 154 60 158 76L160 128C156 136 150 142 146 146C164 160 176 188 182 240Z"/></clipPath>
  <clipPath id="lu-bill"><path d="M157 72C178 72 200 90 212 118C204 122 190 126 176 128C168 129 162 130 157 130Z"/></clipPath>
</defs>
<circle cx="120" cy="120" r="108" fill="url(#lu-glow)"/>
<g class="lu-breathe">

<!-- body, wing and back -->
<path d="M34 240C30 206 40 172 58 146C66 132 66 112 70 98C76 70 98 50 124 50C142 50 154 60 158 76L160 128C156 136 150 142 146 146C164 160 176 188 182 240Z" fill="url(#lu-plume)"/>
<g clip-path="url(#lu-back)">
  <path d="M34 240C30 206 40 172 58 146C66 132 66 112 70 98C76 70 98 50 124 50C142 50 154 60 158 76L160 128C156 136 150 142 146 146C164 160 176 188 182 240Z" fill="none" stroke="url(#lu-rimL)" stroke-width="9" filter="url(#lu-soft)"/>
  <!-- white chest under the dark collar -->
  <path d="M146 146C164 160 176 188 182 240H112C114 204 122 172 138 152Z" fill="url(#lu-belly)"/>
  <path d="M146 146C164 160 176 188 182 240" stroke="#FF10F0" stroke-width="6" fill="none" opacity="0.55" filter="url(#lu-soft)"/>
  <!-- wing -->
  <path d="M50 150C70 142 96 150 112 170C124 186 128 214 126 240H42C40 208 42 172 50 150Z" fill="#14152E"/>
  <path d="M50 150C70 142 96 150 112 170C124 186 128 214 126 240" stroke="#3A4A8C" stroke-width="1.6" fill="none"/>
  <path d="M54 170C68 166 84 168 96 176" stroke="#3A4A8C" stroke-width="1.3" fill="none" opacity="0.7"/><path d="M60 182C74 178 90 180 103 188" stroke="#3A4A8C" stroke-width="1.3" fill="none" opacity="0.7"/><path d="M66 194C80 190 96 192 110 200" stroke="#3A4A8C" stroke-width="1.3" fill="none" opacity="0.7"/><path d="M72 206C86 202 102 204 117 212" stroke="#3A4A8C" stroke-width="1.3" fill="none" opacity="0.7"/><path d="M78 218C92 214 108 216 124 224" stroke="#3A4A8C" stroke-width="1.3" fill="none" opacity="0.7"/><path d="M84 230C98 226 114 228 131 236" stroke="#3A4A8C" stroke-width="1.3" fill="none" opacity="0.7"/>
  <path d="M60 104C70 80 92 62 118 56" stroke="#7E93D8" stroke-width="2" fill="none" opacity="0.45" stroke-linecap="round"/>
</g>

<!-- face disc -->
<path d="M84 96C88 72 108 60 128 60C142 60 152 66 156 78L158 124C148 132 128 136 112 132C96 128 84 114 84 96Z" fill="url(#lu-disc)"/>
<path d="M90 112C100 126 120 132 140 130" stroke="#8D8EA6" stroke-width="1.4" fill="none" opacity="0.6"/>
<!-- the grey line behind the eye -->
<path d="M126 94C116 96 104 98 92 102" stroke="#8D8EA6" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.8"/>

<!-- eye: red ring, dark triangles above and below -->
<path d="M131 79L134 84L128 84Z" fill="#4A4B66" transform="rotate(-16 131 82)"/><path d="M128 100L134 100L131 106Z" fill="#4A4B66" transform="rotate(0 131 102)"/><circle cx="131" cy="92" r="7.2" fill="#FF4B3A"/><clipPath id="lu-eye-s"><circle cx="131" cy="92" r="5.2"/></clipPath><g clip-path="url(#lu-eye-s)"><circle cx="131" cy="92" r="5.2" fill="#B9BACB"/><circle cx="130.4" cy="93.8" r="5.2" fill="#0A0A16"/><circle cx="132.20000000000002" cy="92" r="1.7" fill="#FFFFFF"/><circle cx="129" cy="95.8" r="0.7" fill="#FFFFFF" opacity="0.7"/><path d="M124 86H138V91.6C134 90.4 128 90.4 124 92Z" fill="#F1F1F7"/></g><path d="M124.6 92C128 90.2 134 90.2 137.4 91.4" stroke="#0A0A16" stroke-width="1.6" fill="none" stroke-linecap="round"/>
<rect class="lu-lid" x="125.2" y="86.2" width="11.6" height="11.6" rx="5.8" fill="#B9BACB"/>

<!-- bill -->
<path d="M157 72C178 72 200 90 212 118C204 122 190 126 176 128C168 129 162 130 157 130Z" fill="url(#lu-bill)"/>
<g clip-path="url(#lu-bill)">
  <rect x="155" y="70" width="11" height="64" fill="#6F80A8"/>
  <path d="M166 70V134" stroke="#FFCF33" stroke-width="3"/>
  <path d="M158 75C178 75 198 92 209 114" stroke="#FFB18E" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M176 84C180 98 180 112 175 126" stroke="#D7331A" stroke-width="1.6" fill="none" opacity="0.75"/><path d="M185 90C189 102 189 114 184 124" stroke="#D7331A" stroke-width="1.6" fill="none" opacity="0.75"/><path d="M194 96C198 106 198 116 193 122" stroke="#D7331A" stroke-width="1.6" fill="none" opacity="0.75"/>
  <path d="M157 130C178 128 196 122 210 116" stroke="#FF10F0" stroke-width="5" fill="none" opacity="0.55" filter="url(#lu-soft)"/>
</g>
<path d="M158 108C176 110 196 114 211 118" stroke="#8E1B10" stroke-width="1.6" fill="none"/>

<!-- the yellow rosette at the corner of the mouth -->
<circle cx="157" cy="108" r="4.4" fill="#FFCF33"/>
<circle cx="156" cy="107" r="1.6" fill="#FFF1B3"/>

<!-- sand eels hanging from the bill -->
<g transform="translate(172 112) rotate(-18)"><g class="lu-fish">
    <path d="M0 0C6 9 -6 18.6 2 30" stroke="#5E7C9C" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M0 0C6 9 -6 18.6 2 30" stroke="url(#lu-eel)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M1.2 3C5 9 -4 18 2.4 26" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.75"/>
    <path d="M2 30L-1.5 36L2 33.5L5.5 36Z" fill="#9FC0D8"/>
    <circle cx="0.6" cy="2.4" r="0.9" fill="#0A0A16"/></g></g>
<g transform="translate(182 114) rotate(4)"><g class="lu-fish">
    <path d="M0 0C-6 10.8 6 22.3 -2 36" stroke="#5E7C9C" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M0 0C-6 10.8 6 22.3 -2 36" stroke="url(#lu-eel)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M-1.2 3C-5 10.8 4 21.6 -2.4 32" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.75"/>
    <path d="M-2 36L1.5 42L-2 39.5L-5.5 42Z" fill="#9FC0D8"/>
    <circle cx="-0.6" cy="2.4" r="0.9" fill="#0A0A16"/></g></g>
<g transform="translate(192 116) rotate(14)"><g class="lu-fish">
    <path d="M0 0C6 9.6 -6 19.8 2 32" stroke="#5E7C9C" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M0 0C6 9.6 -6 19.8 2 32" stroke="url(#lu-eel)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M1.2 3C5 9.6 -4 19.2 2.4 28" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.75"/>
    <path d="M2 32L-1.5 38L2 35.5L5.5 38Z" fill="#9FC0D8"/>
    <circle cx="0.6" cy="2.4" r="0.9" fill="#0A0A16"/></g></g>
<g transform="translate(201 118) rotate(30)"><g class="lu-fish">
    <path d="M0 0C-6 7.8 6 16.1 -2 26" stroke="#5E7C9C" stroke-width="4.6" fill="none" stroke-linecap="round"/>
    <path d="M0 0C-6 7.8 6 16.1 -2 26" stroke="url(#lu-eel)" stroke-width="3.4" fill="none" stroke-linecap="round"/>
    <path d="M-1.2 3C-5 7.8 4 15.6 -2.4 22" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.75"/>
    <path d="M-2 26L1.5 32L-2 29.5L-5.5 32Z" fill="#9FC0D8"/>
    <circle cx="-0.6" cy="2.4" r="0.9" fill="#0A0A16"/></g></g>
</g>
</svg>
